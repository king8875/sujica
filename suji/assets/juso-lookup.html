        /* 전체 래퍼 */
        .district-finder {

                margin: 0 auto;

                background: #f8f9fb;

            font-size: 18px !important;

            text-align: center;
            margin-bottom: 32px;
        }

        /* 폼 박스 */
        .form-box {
            background: #f8f9fb;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.06);
        }

        /* 한 줄 */

            display: flex;
            flex-direction: column;
            margin-bottom: 20px;
        }

        /* 라벨 */

            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
        }

        /* 셀렉트 */
        .form-row select {
            height: 48px;
            padding: 0 14px;
            font-size: 15px;
            border: 1px solid #dcdfe6;
            border-radius: 8px;
            background-color: #fff;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .form-row select:focus {
            outline: none;
            border-color: var(--primary-color, #1f4fd8);
            box-shadow: 0 0 0 3px rgba(31,79,216,0.12);
        }

        /* 결과 박스 */
        .result-box {
            margin-top: 24px;
            padding: 20px;
            border-radius: 10px;
            background: #fff;
            border: 1px dashed #d0d5dd;
            text-align: center;
            font-size: 25px;
            font-weight: 700;
            color: #555;
        }

        /* 결과 활성화 상태 (JS에서 클래스 추가 추천) */
        .result-box.active {
            border-color: var(--primary-color, #1f4fd8);
            background: #f1f5ff;
            color: #1f4fd8;
        }

        const categoryDropdown = document.getElementById("category");
        const subcategoryDropdown = document.getElementById("subcategory");
        const outputDiv = document.getElementById("output");

        // 첫 번째 드롭다운 변경 시
        categoryDropdown.addEventListener("change", function () {
            const selectedCategory = categoryDropdown.value;

            // 세부 카테고리 초기화
            subcategoryDropdown.innerHTML = '<option value="">건물번호를 선택하세요.</option>';
            outputDiv.textContent = "주소를 확인하세요.";

            // 선택된 카테고리에 해당하는 세부 항목 추가
            if (selectedCategory && data[selectedCategory]) {
                Object.keys(data[selectedCategory]).forEach(item => {
                    const option = document.createElement("option");
                    option.value = item;
                    option.textContent = item;
                    subcategoryDropdown.appendChild(option);
                });
            }
        });

        // 두 번째 드롭다운 변경 시
        subcategoryDropdown.addEventListener("change", function () {
            const selectedCategory = categoryDropdown.value;
            const selectedSubcategory = subcategoryDropdown.value;

            if (selectedCategory && selectedSubcategory) {
                outputDiv.textContent = data[selectedCategory][selectedSubcategory];
            } else {
                outputDiv.textContent = "주소를 확인하세요.";
            }
        });
